[project]
name = "ordal-filkom"
version = "0.1.0"
description = "Chatbot RAG untuk dokumen akademik FILKOM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LlamaIndex & RAG
    "llama-index",
    "llama-index-llms-groq",
    "llama-index-vector-stores-pinecone",
    # PDF parsing enhancement (tables/diagrams)
    "llama-parse>=0.5.0",
    "nest-asyncio>=1.5.8",
    "PyMuPDF",
    # Vector database
    "pinecone",
    # UI
    "streamlit",
    "streamlit-pdf-viewer",
    # Utils
    "python-dotenv",
]

[tool.uv]
package = false
